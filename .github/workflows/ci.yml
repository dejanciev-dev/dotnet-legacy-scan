name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build LegacyScan.slnx -c Release

      - name: Test
        run: dotnet run --project tests/LegacyScan.Tests -c Release --no-build

      - name: Scan sample solution
        run: dotnet run --project src/LegacyScan -c Release --no-build -- samples/LegacyShop/LegacyShop.sln -o sample-report.html --json sample-report.json

      - name: Pack
        run: |
          VERSION=0.1.0-ci.${{ github.run_number }}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          dotnet pack src/LegacyScan -c Release -p:Version=$VERSION -o nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: package-and-sample-report
          path: |
            nupkg/*.nupkg
            sample-report.html
            sample-report.json

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
