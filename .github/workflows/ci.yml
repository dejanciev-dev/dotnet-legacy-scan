name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build LegacyScan.slnx -c Release

      - name: Test
        run: dotnet run --project tests/LegacyScan.Tests -c Release --no-build

      - name: Scan sample solution
        run: dotnet run --project src/LegacyScan -c Release --no-build -- samples/LegacyShop/LegacyShop.sln -o sample-report.html --json sample-report.json

      - name: Pack
        run: |
          VERSION=0.1.0-ci.${{ github.run_number }}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          dotnet pack src/LegacyScan -c Release -p:Version=$VERSION -o nupkg

      - uses: actions/upload-artifact@v6
        with:
          name: package-and-sample-report
          path: |
            nupkg/*.nupkg
            sample-report.html
            sample-report.json

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error title=NUGET_API_KEY missing::Add the NUGET_API_KEY repository secret (Settings > Secrets and variables > Actions), then re-run this job."
            exit 1
          fi
          # Repeat NuGet's error as an annotation: annotations are visible without signing in, job logs are not.
          if ! out=$(dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate 2>&1); then
            echo "$out"
            echo "::error title=NuGet push failed::$(echo "$out" | grep -iE 'error|forbidden|unauthorized|conflict|40[0-9]' | head -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "$out"
